name: Build from drop folder

on:
  push:
    paths:
      - 'drop/**'
      - '!drop/README.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the project in drop
        id: find
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p work
          BEST=""
          BEST_T=0
          for f in drop/*.zip; do
            [ -e "$f" ] || continue
            T=$(git log -1 --format=%ct -- "$f")
            if [ "${T:-0}" -ge "$BEST_T" ]; then
              BEST="$f"
              BEST_T="${T:-0}"
            fi
          done
          if [ -n "$BEST" ]; then
            echo "Using $BEST"
            unzip -q -o "$BEST" -d work
          else
            echo "No zip found, using files in drop"
            cp -r drop/. work/
          fi
          PROJ=$(find work -name project.godot -not -path '*/.godot/*' | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "project.godot was not found in the drop folder"
            exit 1
          fi
          DIR=$(dirname "$PROJ")
          if [ ! -f "$DIR/export_presets.cfg" ]; then
            cp .github/default_export_presets.cfg "$DIR/export_presets.cfg"
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Godot and signing
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /root/debug.keystore
          else
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
            mv debug.keystore /root/debug.keystore
          fi
          godot -v -e --quit --headless
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/force_system_user = false' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/timestamping_authority_url = ""' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/shutdown_adb_on_exit = true' >> ~/.config/godot/editor_settings-4.tres

      - name: Import and export APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          godot --headless --import || true
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/UnicornDash.apk
          ls -la build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnicornDash-apk
          path: ${{ steps.find.outputs.dir }}/build/android/UnicornDash.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/build/android/UnicornDash.apk
